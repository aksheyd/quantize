name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: extractions/setup-just@v4

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Docs
        run: just doc

      - name: Chapters
        run: just chapters

  # Temporary: times matmul with the batch in groups of vectors.
  group-sizes:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Describe the CPU
        run: |
          if command -v lscpu; then lscpu; else
            sysctl -n machdep.cpu.brand_string
            sysctl hw | grep -E 'cachesize|cpu|perflevel' || true
          fi

      - name: Check bits against main
        run: cargo run --release --manifest-path timing/Cargo.toml --bin bits

      - name: Time main and this branch
        run: cargo run --release --manifest-path timing/Cargo.toml --bin compare

      - name: Time main and this branch in a debug build that optimizes dependencies
        run: cargo run --manifest-path timing/Cargo.toml --bin compare

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Check
        run: just minimum-rust

  # 3.14t is free-threaded Python, which runs the thread tests without the GIL.
  python:
    strategy:
      matrix:
        python: ["3.12", "3.14t"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: extractions/setup-just@v4

      - name: Bindings tests
        run: |
          just setup
          just python
