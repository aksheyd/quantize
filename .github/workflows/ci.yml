name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: extractions/setup-just@v4

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Docs
        run: just doc

      - name: Chapters
        run: just chapters

      # Each runner's CPU has kernels of its own, x86 on Linux and Arm on
      # macOS, that ggml multiplies quantize's Q4_0 and Q8_0 tensors with.
      - name: ggml check
        run: just ggml-check

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Check
        run: just minimum-rust

  # 3.14t is free-threaded Python, which runs the thread tests without the GIL.
  python:
    strategy:
      matrix:
        python: ["3.12", "3.14t"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: extractions/setup-just@v4

      - name: Bindings tests
        run: |
          just setup
          just python

      # safetensors has no stable wheel for free-threaded Python yet.
      - name: Files check
        if: matrix.python == '3.12'
        run: just files-check
