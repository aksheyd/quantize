name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: extractions/setup-just@v4

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Docs
        run: just doc

      - name: Chapters
        run: just chapters

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Check
        run: just minimum-rust

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@v4

      - name: Bindings tests
        run: |
          just setup
          just python
