name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: extractions/setup-just@v4

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Docs
        run: just doc

      - name: Chapters
        run: just chapters

  apple-silicon-timing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: extractions/setup-just@v4

      - name: Hardware
        run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.perflevel0.logicalcpu || true

      - name: Throughput
        run: just throughput

      - name: Kernel variants, 32-code groups, interleaved
        run: cargo run --release -p benchmarks --example kernel_scratch3

      - name: Kernel variants, again
        run: ./target/release/examples/kernel_scratch3

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Check
        run: just minimum-rust

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@v4

      - name: Bindings tests
        run: |
          just setup
          just python
