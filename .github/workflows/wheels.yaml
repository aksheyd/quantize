name: wheels

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each platform builds two wheels. Python 3.12 builds the abi3 wheel, which
  # every later Python loads, except free-threaded builds, so 3.14t builds
  # one of its own. Each wheel is tested on the Python it was built for.
  linux:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.12", "3.14t"]
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: extractions/setup-just@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility pypi -i python${{ matrix.python }}
          manylinux: auto

      - name: Test wheel
        run: |
          pip install dist/*.whl pytest
          just python-test

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  windows:
    strategy:
      matrix:
        python: ["3.12", "3.14t"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: extractions/setup-just@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --compatibility pypi -i python${{ matrix.python }}

      - name: Test wheel
        run: |
          pip install (Get-ChildItem dist\*.whl).FullName pytest
          just python-test

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64-${{ matrix.python }}
          path: dist

  macos:
    strategy:
      matrix:
        runner: [macos-latest, macos-15-intel]
        python: ["3.12", "3.14t"]
        include:
          - runner: macos-latest
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: extractions/setup-just@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility pypi -i python${{ matrix.python }}

      - name: Test wheel
        run: |
          pip install dist/*.whl pytest
          just python-test

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # On a version tag, these jobs run in order, each needing the one before it,
  # so a failure stops the rest. PyPI goes before crates.io because PyPI
  # accepts the same files again, so its job can be re-run, while crates.io
  # takes each version only once.
  release-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: extractions/setup-just@v4

      - name: Check the release
        run: just release-check "$GITHUB_REF_NAME"

  pypi:
    needs: [release-check, linux, windows, macos, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # With caching on, setup-uv's post step can fail the job after the upload.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  crates-io:
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # crates.io takes each version only once, so a crate it already has at
      # this version is skipped, and re-running the job after a partial
      # failure publishes only what's missing. If its API doesn't answer,
      # cargo publish runs anyway, and refuses a version crates.io has. The
      # API turns away requests whose user agent doesn't say who's asking.
      # A crate held back from a release with `publish = false` is skipped.
      - name: Publish to crates.io
        run: |
          publish() {
            crate=$1
            token=$2
            # cargo metadata lists the registries a crate may go to, and
            # `publish = false` in its Cargo.toml makes that list empty.
            registries=$(cargo metadata --format-version 1 --no-deps |
              jq --compact-output --arg crate "$crate" '.packages[] | select(.name == $crate) | .publish')
            if [ "$registries" = "[]" ]; then
              echo "$crate says publish = false in its Cargo.toml, so it isn't published"
            elif curl --silent --fail --output /dev/null \
                --user-agent "aksheyd/quantize release (https://github.com/aksheyd/quantize)" \
                "https://crates.io/api/v1/crates/$crate/$GITHUB_REF_NAME"; then
              echo "$crate $GITHUB_REF_NAME is already on crates.io"
            else
              CARGO_REGISTRY_TOKEN="$token" cargo publish -p "$crate"
            fi
          }
          # quantize-files requires this exact quantize, so quantize goes first.
          publish quantize "$TRUSTED_PUBLISHING_TOKEN"
          publish quantize-files "${BOOTSTRAP_TOKEN:-$TRUSTED_PUBLISHING_TOKEN}"
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.auth.outputs.token }}
          # A trusted-publishing token can't create a crate, so a crate's first
          # version needs an API token, set as this secret until the crate has
          # a trusted publisher on crates.io.
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}

  github-release:
    needs: crates-io
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Create the GitHub release
        run: |
          just release-notes "$GITHUB_REF_NAME" |
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "quantize $GITHUB_REF_NAME" --notes-file -
        env:
          GH_TOKEN: ${{ github.token }}
