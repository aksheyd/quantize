[package]
name = "quantize"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "A simple quantization library."
license = "MIT"
repository = "https://github.com/aksheyd/quantize"
documentation = "https://docs.rs/quantize"
readme = "README.md"
keywords = ["quantization", "ml", "int4", "matmul", "i8"]
categories = ["science", "mathematics"]
authors = ["Akshey Deokule (aksheyd)"]
include = [
    "/src/**",
    "/LICENSE",
    "/README.md",
]

[package.metadata.docs.rs]
features = ["std"]

[workspace]
members = ["python", "chapters", "benchmarks"]
default-members = [".", "chapters", "benchmarks"]
resolver = "3"

[workspace.package]
# Shared with the Python package. Between releases it ends in -dev.
version = "0.3.0-dev"

[workspace.dependencies]
half = "2"
pyo3 = "0.29"
numpy = "0.29"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[features]
default = ["std"]
# Reserved for future no_std support. For now it only implements
# std::error::Error for Error.
std = []

[dependencies]
half = { workspace = true }

[lints]
workspace = true
