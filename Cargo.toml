[package]
name = "quantize"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "A simple quantization library."
license = "MIT"
repository = "https://github.com/aksheyd/quantize"
documentation = "https://docs.rs/quantize"
readme = "README.md"
keywords = ["quantization", "ml", "int4", "matmul", "i8"]
categories = ["science", "mathematics"]
authors = ["Akshey Deokule (aksheyd)"]
include = [
    "/src/**",
    "/LICENSE",
    "/README.md",
]

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["python", "chapters"]
default-members = [".", "chapters"]
resolver = "3"

[workspace.package]
# Shared with the Python package. Between releases it ends in -dev.
version = "0.3.0-dev"

[workspace.dependencies]
half = "2"
pyo3 = "0.29"
numpy = "0.29"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[features]
default = ["std"]
std = []
workload = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:serde",
    "dep:serde_json",
    "dep:ureq",
]

[dependencies]
half = { workspace = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", optional = true }

[dev-dependencies]
candle-core = "0.11"
rand = "0.10"

[lints]
workspace = true

[[example]]
name = "compare"
path = "benchmarks/compare.rs"

[[example]]
name = "update_readme"
path = "benchmarks/update_readme.rs"

[[example]]
name = "throughput"
path = "benchmarks/throughput.rs"

[[example]]
name = "wikitext"
path = "benchmarks/wikitext.rs"
required-features = ["workload"]
