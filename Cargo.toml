[package]
name = "quantize"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "A simple quantization library."
license = "MIT"
repository = "https://github.com/aksheyd/quantize"
documentation = "https://docs.rs/quantize"
readme = "README.md"
keywords = ["quantization", "ml", "int4", "matmul", "i8"]
categories = ["science", "mathematics"]
authors = ["Akshey Deokule (aksheyd)"]
include = [
    "/src/**",
    "/LICENSE",
    "/README.md",
]

[workspace]
members = ["python", "chapters", "benchmarks", "files", "smollm"]
# benchmarks, files, and smollm aren't default members, so a first chapter run
# doesn't download their dependencies, like candle and serde_json. They run
# with -p benchmarks, -p quantize-files, and -p smollm.
default-members = [".", "chapters"]
resolver = "3"

[workspace.package]
# Shared with the Python package. Between releases it ends in -dev.
version = "0.4.0"

[workspace.dependencies]
half = "2"
pyo3 = "0.29"
numpy = "0.29"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# Splits large matmul calls across every core.
rayon = ["dep:rayon"]

[dependencies]
half = { workspace = true }
rayon = { version = "1", optional = true }

[lints]
workspace = true
