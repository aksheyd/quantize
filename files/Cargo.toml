[package]
name = "quantize-files"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Read and write the files models ship in, with quantize's tensors inside."
repository = "https://github.com/aksheyd/quantize"

[dependencies]
quantize = { path = ".." }
half = { workspace = true }
serde_json = "1"

[lints]
workspace = true

# The Rust halves of `just files-check`, with check_safetensors.py and
# check_gguf.py. check_gguf also writes the file that `just ggml-check` loads.
[[example]]
name = "check_safetensors"
path = "check_safetensors.rs"

[[example]]
name = "check_gguf"
path = "check_gguf.rs"
