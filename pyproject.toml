[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "quantize-py"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
license = "MIT"
license-files = ["LICENSE"]
description = "Python bindings for the quantize crate."
readme = "python/README.md"
authors = [{ name = "Akshey Deokule" }]
keywords = ["quantization", "machine-learning", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/aksheyd/quantize"
Documentation = "https://github.com/aksheyd/quantize/tree/main/python"
Homepage = "https://github.com/aksheyd/quantize"

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "quantize._native"
python-source = "python"
exclude = [
    ".venv/**",
    ".pytest_cache/**",
    "target/**",
    "**/__pycache__/**",
    "python/quantize/_native.*",
    "AGENTS.md",
]

[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "pypi"
