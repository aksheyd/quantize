[package]
name = "quantize-py"
version.workspace = true
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Python bindings for the quantize crate."
repository = "https://github.com/aksheyd/quantize"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
quantize = { path = ".." }
half = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312"] }
numpy = { workspace = true }

[lints]
workspace = true
