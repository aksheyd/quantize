[package]
name = "smollm"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Quantize SmolLM-135M with quantize and generate text with it."
repository = "https://github.com/aksheyd/quantize"

# hf-hub and tokenizers take the versions and features the benchmarks use, so
# the lockfile holds one copy of each.
[dependencies]
quantize = { path = ".." }
quantize-files = { path = "../files" }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde_json = "1"

[lints]
workspace = true
