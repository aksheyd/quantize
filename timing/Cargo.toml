[package]
name = "timing"
edition = "2024"
publish = false

# Its own workspace, so the repository's lint and test runs leave it out.
[workspace]

[dependencies]
quantize = { path = ".." }
quantize_main = { package = "quantize", git = "https://github.com/aksheyd/quantize", rev = "872dd65fb1ce6feba6d186d6f26e8355c31a2e7b" }

[[bin]]
name = "compare"
path = "compare.rs"

[[bin]]
name = "bits"
path = "bits.rs"

# A debug build that optimizes its dependencies, as many projects set up.
[profile.dev.package."*"]
opt-level = 3
